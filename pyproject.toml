[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "object_detection_training"
version = "0.0.1"
description = "Object detector training project using rfnet and hydra"
authors = [{name = "Enrique G. Ortiz", email = "ortizeg@gmail.com"}]
license = {text = "Apache-2.0"}
dependencies = [
    "hydra-core",
    "loguru",
    "numpy<2.0.0",
    "onnxscript>=0.5.6,<0.6",
    "lightning",
    "pydantic>=2.0",
    "fvcore",
    "wandb>=0.23.1,<0.24",
    "iopath>=0.1.10,<0.2",
    "colored>=2.3.1,<3",
    "torch",
    "torchvision",
    "pycocotools",
    "pandas",
    "matplotlib",
    "seaborn",
    "Pillow",
    "opencv-python",
    "rich",
    "transformers<4.49.0",
    "scipy",
    "requests",
    "tqdm",
    "torchmetrics",
    "python-dotenv",
    "orjson",
    "tensorboard",
    "supervision",
    "peft",
    "onnxruntime",
]

[project.scripts]
task_manager = "object_detection_training.task_manager:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "S",    # bandit (security)
    "A",    # builtins
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/object_detection_training/models/yolox/**" = ["ALL"]
"src/object_detection_training/models/rfdetr/**" = ["ALL"]
"scripts/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["object_detection_training"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["cv2.*", "albumentations.*", "torchvision.*", "rfdetr.*", "hydra.*", "omegaconf.*", "torch.*", "lightning.*", "tensorboard.*", "onnx.*", "onnxsim.*", "numpy.*", "fvcore.*", "wandb.*", "iopath.*", "colored.*", "pycocotools.*", "scipy.*", "tqdm.*", "torchmetrics.*", "dotenv.*", "orjson.*", "supervision.*", "peft.*", "transformers.*", "requests.*", "pandas.*", "matplotlib.*", "seaborn.*", "PIL.*", "rich.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "object_detection_training.models",
    "object_detection_training.models.base",
    "object_detection_training.models.rfdetr_wrappers",
    "object_detection_training.models.rfdetr_lightning",
    "object_detection_training.models.rfdetr.*",
    "object_detection_training.models.yolox.*",
    "object_detection_training.models.yolox_lightning",
    "object_detection_training.data.mosaic",
]
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["type-arg", "misc", "assignment", "arg-type", "attr-defined", "no-redef", "union-attr", "return-value", "operator", "var-annotated", "untyped-decorator", "name-defined", "import-not-found", "unused-ignore"]

[[tool.mypy.overrides]]
module = ["object_detection_training.transforms.*"]
disallow_untyped_calls = false
disable_error_code = ["misc"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "pip install build && python -m build"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "dev"
