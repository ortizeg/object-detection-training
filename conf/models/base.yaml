# Base model configuration - defaults matching rfdetr package
num_classes: null
input_height: ${input_height}
input_width: ${input_width}
learning_rate: 1e-4
weight_decay: 1e-4

warmup_epochs: 2

output_dir: ${hydra:runtime.output_dir}

# ImageNet normalization (0-1 scale, used by visualization callback for denormalization)
image_mean: [0.485, 0.456, 0.406]
image_std: [0.229, 0.224, 0.225]
