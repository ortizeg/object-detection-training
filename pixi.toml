[workspace]
name = "object-detection-training"
version = "0.1.0"
description = "Basketball training project using rfnet and hydra"
authors = ["Enrique G. Ortiz <ortizeg@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[system-requirements]
cuda = "12.1"

[tasks]
task_manager = { cmd = "task_manager", env = { KMP_DUPLICATE_LIB_OK = "TRUE" } }
test = "pytest"
test-cov = "pytest --cov=src --cov-report=term --cov-report=xml -v"
precommit = "pre-commit run --all-files"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "mypy src/"
build = { cmd = "bash scripts/cloud-build.sh" }
build-local = { cmd = "bash scripts/build-docker.sh --local" }
docs = "mkdocs serve"
docs-build = "mkdocs build"


[dependencies]
python = "3.11.*"
hydra-core = "*"
loguru = "*"
numpy = "<2.0.0"
onnxscript = ">=0.5.6,<0.6"
lightning = "*"
pydantic = ">=2.0"
fvcore = "*"
wandb = ">=0.23.1,<0.24"
iopath = ">=0.1.10,<0.2"
colored = ">=2.3.1,<3"
pytorch = "*"
torchvision = "*"
pycocotools = "*"
pandas = "*"
matplotlib = "*"
seaborn = "*"
pillow = "*"
opencv = "*"
rich = "*"
psutil = ">=7.2.2,<8"
google-genai = ">=1.63.0,<2"

[feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
tensorboard = ">=2.20.0,<3"
ruff = "*"
mypy = "*"
pre-commit = "*"
mkdocs = "*"
mkdocs-material = "*"

[environments]
default = ["dev"]
prod = []

[pypi-dependencies]
transformers = { version = ">=4.49.0, <4.52.0" }  # SmolVLM2 needs >=4.49.0; DINOv2 constraint only affects training
scipy = { version = "*" }  # Hungarian matching in matcher
requests = { version = "*" }  # Checkpoint downloading
tqdm = { version = "*" }  # Download progress bars
torchmetrics = { version = "*" }
object-detection-training = { path = ".", editable = true }
dotenv = "*"
orjson = "*"  # Fast JSON parsing for dataset loading
supervision = "*"
peft = "*"
mkdocstrings = { version = "*", extras = ["python"] }
onnxruntime = ">=1.23.2, <2"
