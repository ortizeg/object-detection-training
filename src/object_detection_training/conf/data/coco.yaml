# COCO Dataset Configuration (RF-DETR default)
# Uses square resize transforms with normalized CXCYWH boxes.
defaults:
  - /transforms@_here_: rfdetr_square
  - _self_

_target_: object_detection_training.data.coco_data_module.COCODataModule
_convert_: all

train_path: ??? # Required - path to training data
val_path: ??? # Required - path to validation data
test_path: null # Optional - path to test data
batch_size: 8 # Optimized for total batch size 16 (8 * 2)
num_workers: 8 # Match rfdetr TrainConfig default
input_height: ${models.input_height}
input_width: ${models.input_width}

# Multi-scale params (referenced by transform YAML via ${data.*})
multi_scale: true
expanded_scales: true
skip_random_resize: false
patch_size: 16
num_windows: 2 # Match RFDETRMediumConfig (small=4, medium=2, large=2)

pin_memory: true
persistent_workers: true

# Online class-balanced sampling
sampler:
  mode: disabled
