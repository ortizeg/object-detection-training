# COCO Dataset Configuration for DINO-X on 8x L4 (24GB VRAM)
# Matches official YOLOX: effective batch 64 (8 GPUs x 8/GPU, no accum)
# CacheDataset + cached mosaic enabled for fast IO.
defaults:
  - /transforms@_here_: yolox
  - _self_

_target_: object_detection_training.data.coco_data_module.COCODataModule
_convert_: all

train_path: ??? # Required - path to training data
val_path: ??? # Required - path to validation data
test_path: null # Optional - path to test data

# L4 24GB: bs=8 per GPU, 8 GPUs, no accum → effective 64
batch_size: 8
num_workers: 8

input_height: ${models.input_height}
input_width: ${models.input_width}

# Multi-scale params (official YOLOX: random resize every 10 iters)
multi_scale: true
expanded_scales: true
skip_random_resize: false
patch_size: 16
num_windows: 2

pin_memory: true
persistent_workers: true

# Cache decoded images for fast loading (eliminates GCS FUSE IO bottleneck)
use_cache: true
cache_type: auto

# Online class-balanced sampling
sampler:
  mode: disabled
