# Specialized Export Task for Basketball RF-DETR Medium

defaults:
  - /models@model: RFDETRMedium

_target_: object_detection_training.tasks.ONNXExportTask
name: basketball_export_onnx
output_path: model.onnx  # Will be relative to Hydra output dir

# Checkpoint path can be set via CKPT_PATH env var or CLI override.
# Use env var when the path contains '=' (e.g. epoch=80-val/mAP=0.4563.ckpt)
# as Hydra's override grammar cannot parse '=' in values.
checkpoint_path: ${oc.env:CKPT_PATH,???}

# Export settings
opset_version: 17
simplify: true

# Dimensions are inferred from checkpoint if None
input_height: null
input_width: null

# Num classes inferred from checkpoint if None (e.g. 10 foreground -> 11 total)
num_classes: null

# Enable dynamic batch size (axis 0)
dynamic_batch: true
