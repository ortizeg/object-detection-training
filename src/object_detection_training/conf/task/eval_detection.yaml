# Evaluation Detection Task Configuration
_target_: object_detection_training.tasks.eval_detection_task.EvalDetectionTask
name: eval_detection

# Data directories (COCO format with _annotations.coco.json)
val_dir: ???               # Required: path to val directory
test_dir: ???              # Required: path to test directory

# Gemini config
run_gemini: true
gemini_model_name: "gemini-3.1-pro-preview"
gemini_classes:
  - "ball"
  - "number"
  - "player"
  - "referee"
  - "rim"
gemini_prompt_template: >
  Detect all basketball players, referees, the rim, the basketball, and
  visible jersey numbers in this basketball game image.
  Constraints:
  - At most 10 players, 3 referees, 1 rim, and 1 ball per image.
  - Each person gets exactly ONE bounding box with the most specific label.
  Use EXACTLY these labels:
  - "player" for any basketball player on the court
  - "referee" for game officials
  - "ball" for the basketball (only when NOT going through the rim)
  - "rim" for the basketball hoop rim
  - "number" for visible jersey numbers (tight box around the digits only)

# SmolVLM2 config
run_smolvlm2: true
smolvlm2_model_name: "HuggingFaceTB/SmolVLM2-256M-Video-Instruct"

# RF-DETR config
run_rfdetr: true
onnx_model_path: null      # Path to RF-DETR ONNX model
label_mapping_path: null   # Path to labels_mapping.json
rfdetr_input_size: 560
rfdetr_confidence_threshold: 0.01

# Evaluation config
confidence_threshold_steps: 20
