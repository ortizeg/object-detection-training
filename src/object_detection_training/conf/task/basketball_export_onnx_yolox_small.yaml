# Specialized Export Task for Basketball YOLOX Small

defaults:
  - /models@model: yolox_s

_target_: object_detection_training.tasks.ONNXExportTask
name: basketball_export_onnx_yolox

output_path: model.onnx  # Will be relative to Hydra output dir

# Checkpoint path can be set via CKPT_PATH env var or CLI override.
# Use env var when the path contains '=' (e.g. epoch=95-val/mAP=0.4272.ckpt)
# as Hydra's override grammar cannot parse '=' in values.
checkpoint_path: ${oc.env:CKPT_PATH,???}

# Export settings
opset_version: 17
simplify: true

# YOLOX Small uses 640x640 input
input_height: 640
input_width: 640

# Basketball: 10 training classes
num_classes: 10

# Enable dynamic batch size (axis 0)
dynamic_batch: true
