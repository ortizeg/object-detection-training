# DINO-X Training Task Configuration

defaults:
  - _self_
  - task: train
  - models: dinox_m_baseline
  - data: coco
  - trainer: default
  - callbacks: default
  - logging: null

# Global Parameters
input_height: 640
input_width: 640
log_level: INFO

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
