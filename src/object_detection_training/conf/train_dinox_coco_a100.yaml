# DINO-X COCO Ablation Training Configuration (A100)
# A100 40GB: batch_size=64, bf16-mixed, val every 10 epochs.
# Training from scratch (no pretrained weights).

defaults:
  - _self_
  - task: train
  - models: dinox_m_baseline
  - data: coco_dinox_a100
  - trainer: gpu_a100
  - callbacks: default
  - logging: null

# Global Parameters
input_height: 640
input_width: 640
log_level: INFO

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
