defaults:
  - base
  - _self_

# DINO-X Base Configuration
# Inherits official YOLOX hyperparameters as baseline.
# LR scales linearly: lr = 0.01 * batch_size / 64
learning_rate: 0.01
weight_decay: 5e-4
warmup_epochs: 5
download_pretrained: true
pretrain_weights: null
freeze_backbone_epochs: 0

# No-augmentation refinement period: disable mosaic/mixup, enable L1 loss.
# Official YOLOX: 15, RTMDet: 20.  Using 20 for stronger refinement.
no_aug_epochs: 20

iou_loss_type: iou

# Architecture (common defaults, matching YOLOX-S baseline)
depth: 0.33
width: 0.50
depthwise: false
in_channels:
  - 256
  - 512
  - 1024

# DFL settings (off by default = standard YOLOX behavior)
use_dfl: false
reg_max: 16
dfl_loss_weight: 0.25

# Soft label settings (off by default = standard YOLOX behavior)
use_soft_labels: false
soft_label_gamma: 2.0
use_log_iou_cost: false

# MAL settings (off by default)
use_mal: false
mal_gamma: 1.5

# Dual head settings (off by default)
use_dual_head: false
lambda_o2o: 1.0

# Assignment strategy (simota = standard YOLOX behavior)
assigner: simota
tal_topk: 13
tal_alpha: 1.0
tal_beta: 6.0

# Distillation settings (off by default)
enable_distillation: false
distill_weight: 0.5
distill_layer_indices:
  - 3
  - 7
  - 11
distill_teacher: dinov2_vitb14

# Scheduler-free optimizer (off by default = SGD + cosine)
use_scheduler_free: false

# torch.compile backbone for 10-15% forward pass speedup
# Requires C compiler (gcc) in container — disabled for runtime images.
# Enable when using devel base image or after adding gcc to Dockerfile.
compile_backbone: false

# YOLOX-style: raw 0-255 float values, no normalization
image_mean: null
image_std: null
