defaults:
  - base
  - _self_

# YOLOX Base Configuration
# Official YOLOX hyperparameters (matching Megvii repo)
# LR scales linearly: lr = 0.01 * batch_size / 64
learning_rate: 0.01
weight_decay: 5e-4
warmup_epochs: 5
download_pretrained: true
pretrain_weights: null
freeze_backbone_epochs: 0

# No-augmentation refinement period: disable mosaic/mixup, enable L1 loss.
# Official YOLOX: 15, RTMDet: 20.  Using 20 for stronger refinement.
no_aug_epochs: 20

iou_loss_type: iou

# --- Architecture (common defaults, matching YOLOX-S) ---
depth: 0.33
width: 0.50
depthwise: false
in_channels:
  - 256
  - 512
  - 1024

# YOLOX uses raw 0-255 float values — no image normalization applied
image_mean: null
image_std: null
