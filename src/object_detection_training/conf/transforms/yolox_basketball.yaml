# YOLOX Transform Pipeline for Basketball Fine-tuning
# Mosaic/mixup disabled (too aggressive for small datasets).
# RandomErasing enabled for extra regularization on small datasets.
# Boxes converted to pixel CXCYWH (matching original YOLOX repo). No box normalization.
# No image normalization (raw 0-255).
train_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5
    - _target_: torchvision.transforms.v2.Resize
      size:
        - ${data.input_height}
        - ${data.input_width}
    - _target_: torchvision.transforms.v2.ColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.RandomErasing
      p: 0.3
      scale: [0.02, 0.2]
      ratio: [0.3, 3.3]
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

val_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.Resize
      size:
        - ${data.input_height}
        - ${data.input_width}
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

test_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.Resize
      size:
        - ${data.input_height}
        - ${data.input_width}
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

# Post-mosaic transforms: skip Resize since mosaic canvas is already at target size
post_mosaic_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5
    - _target_: torchvision.transforms.v2.ColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.RandomErasing
      p: 0.3
      scale: [0.02, 0.2]
      ratio: [0.3, 3.3]
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

# Mosaic/MixUp disabled for basketball fine-tuning
mosaic:
  enabled: false
  mixup_prob: 0.3
