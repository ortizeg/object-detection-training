# YOLOX Transform Pipeline
# Boxes converted to pixel CXCYWH (matching original YOLOX repo). No box normalization.
# No image normalization (raw 0-255), stronger color augmentation for regularization.
train_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5
    - _target_: torchvision.transforms.v2.Resize
      size:
        - ${data.input_height}
        - ${data.input_width}
    - _target_: torchvision.transforms.v2.ColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.RandomErasing
      p: 0.3
      scale: [0.02, 0.2]
      ratio: [0.3, 3.3]
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

val_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.Resize
      size:
        - ${data.input_height}
        - ${data.input_width}
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

test_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.Resize
      size:
        - ${data.input_height}
        - ${data.input_width}
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

# Post-mosaic transforms: skip Resize since mosaic canvas is already at target size
post_mosaic_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5
    - _target_: torchvision.transforms.v2.ColorJitter
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.RandomErasing
      p: 0.3
      scale: [0.02, 0.2]
      ratio: [0.3, 3.3]
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

# Mosaic/MixUp config (DataModule-level, not part of v2 pipeline)
mosaic:
  enabled: false
  mixup_prob: 0.3
  # RTMDet-style cached mosaic: companion images served from memory cache
  # instead of disk, reducing I/O from 6 reads/sample to 1.
  use_cache: true
  max_cached_images: 40
  random_pop: true
