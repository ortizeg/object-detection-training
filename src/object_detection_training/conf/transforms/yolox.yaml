# YOLOX Transform Pipeline
# Boxes converted to pixel CXCYWH (matching original YOLOX repo). No box normalization.
# No image normalization (raw 0-255). Matching official YOLOX augmentation.
train_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5
    - _target_: torchvision.transforms.v2.Resize
      size:
        - ${data.input_height}
        - ${data.input_width}
    - _target_: object_detection_training.transforms.HSVRandomAug
      hue_delta: 5
      saturation_delta: 30
      value_delta: 30
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

val_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.Resize
      size:
        - ${data.input_height}
        - ${data.input_width}
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

test_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: torchvision.transforms.v2.Resize
      size:
        - ${data.input_height}
        - ${data.input_width}
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

# Post-mosaic transforms: mosaic outputs a 2x canvas (1280x1280).
# RTMDet-style RandomResizeCrop brings it back to input_size with random
# scale augmentation (ratio_range 0.1-2.0), replacing YOLOX RandomAffine.
post_mosaic_transforms:
  _target_: torchvision.transforms.v2.Compose
  transforms:
    - _target_: object_detection_training.transforms.RandomResizeCrop
      crop_size:
        - ${data.input_height}
        - ${data.input_width}
      ratio_range:
        - 0.1
        - 2.0
      pad_val: 114
    - _target_: torchvision.transforms.v2.RandomHorizontalFlip
      p: 0.5
    - _target_: object_detection_training.transforms.HSVRandomAug
      hue_delta: 5
      saturation_delta: 30
      value_delta: 30
    - _target_: object_detection_training.transforms.ToFloat32Tensor
      scale: false
    - _target_: torchvision.transforms.v2.ConvertBoundingBoxFormat
      format: CXCYWH

# Mosaic/MixUp config (DataModule-level, not part of v2 pipeline)
# Official YOLOX: mosaic prob=1.0, mixup prob=1.0 for first 285 epochs
mosaic:
  enabled: true
  mixup_prob: 1.0
  # Official YOLOX center range: (0.5, 1.5) on a 2x canvas
  center_ratio_range:
    - 0.5
    - 1.5
  # MixUp blend ratio — Beta(a, b) distribution parameters.
  # RTMDet: (1.0, 1.0) = uniform = fixed 0.5 blend.
  # Official YOLOX: (0.8, 1.6) = slightly mosaic-dominant.
  mixup_ratio:
    - 1.0
    - 1.0
  # RTMDet-style cached mosaic: companion images served from memory cache
  # instead of disk, reducing I/O from 6 reads/sample to 1.
  use_cache: true
  max_cached_images: 40
  random_pop: true
